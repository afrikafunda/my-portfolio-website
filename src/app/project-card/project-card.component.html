<div class= "card shadow text-center" style="max-width: 350px; min-width: 350px;">
    <div class="card-body">
        <h5 class="card-title">{{project.name}}</h5>
        <p class="card-text">{{project.summary}}</p>
        <button class="btn btn-primary" (click)="OpenProjectModal()" >View More</button>
    </div>

    
<div class="card-footer">
    <div class="d-flex flex-wrap justify-content-center align-items-center">

        <div *ngFor="let tag of project.tags"
             class="me-2 mb-1"
             [attr.title]="tag.toString()"
             style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">

            <img [src]="tag.imageUrl"
                 [alt]="tag.toString()"
                 width="36"
                 height="36"
                 style="object-fit: contain;">
        </div>

    </div>
</div>

</div>
