<div class="console-card text-center" style="max-width: 350px; min-width: 350px;">
    <div class="console-card__body">
        <h5 class="console-card__title">{{project.name}}</h5>
        <p class="console-card__summary">{{project.summary}}</p>
        <button class="btn btn-primary" (click)="OpenProjectModal()">View More</button>
    </div>

    <div class="console-card__footer">
        <div class="d-flex flex-wrap justify-content-center align-items-center">

            <div *ngFor="let tag of project.tags"
                 class="icon-box-sm me-2 mb-1"
                 [attr.title]="tag.toString()">

                <img [src]="tag.imageUrl" [alt]="tag.toString()">
            </div>

        </div>
    </div>
</div>
