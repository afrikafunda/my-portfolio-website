<div class="modal-header">
    <h2> {{project.name}}</h2>
    <button class="btn-close" (click)="bsModalRef.hide()"></button>
</div>
<div class="modal-body">
    <carousel>
        <div *ngFor="let picture of project.pictures">
            <slide> <img src={{picture}} alt="slide" style="display: block; width: 100%;">   
            </slide>
        </div>


        
    </carousel>

    <h3 class="mt-2">Description</h3>
    <p>{{project.description}}</p>
    <p>You can find this project on Github <a href="{{project.projectLink}}" class="href" target="_blank">here</a></p>

    <hr>
    
<hr>

    <div class="d-flex flex-wrap align-items-center">
        <div *ngFor="let tag of project.tags"
            class="me-2 mb-1"
            [attr.title]="tag.toString()"
            style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">

            <img [src]="tag.imageUrl"
                [alt]="tag.toString()"
                width="36"
                height="36"
                style="object-fit: contain;">
        </div>
    </div>

</div>
