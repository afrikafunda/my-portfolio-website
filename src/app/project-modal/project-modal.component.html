<div class="modal-header">
    <h2 class="modal-title-glitch">{{project.name}}</h2>
    <button class="btn-close" (click)="bsModalRef.hide()" aria-label="Close"></button>
</div>
<div class="modal-body">
    <div class="media-frame" *ngIf="project.pictures?.length">
        <carousel>
            <div *ngFor="let picture of project.pictures">
                <slide><img [src]="picture" alt="slide" style="display: block; width: 100%;"></slide>
            </div>
        </carousel>
    </div>

    <h3 class="mt-3 section-label">Description</h3>
    <p class="modal-text">{{project.description}}</p>
    <p class="modal-text">You can find this project on GitHub
        <a [href]="project.projectLink" target="_blank" rel="noopener">here</a>
    </p>

    <hr>

    <div class="d-flex flex-wrap gap-2">
        <span *ngFor="let tag of project.tags" class="tag-pill">
            <span class="tag-pill__dot" [style.background-color]="tag.color"></span>
            {{ tag }}
        </span>
    </div>
</div>
